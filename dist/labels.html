<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important;pointer-events:none!important}
*{box-sizing:border-box;pointer-events:none!important}
#canvas{position:absolute;inset:0;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#f5e8ce}
.entry{position:absolute;left:0;top:0;min-width:45px;max-width:min(370px,40vw);text-align:center;transform:translate(-50%,-50%);will-change:transform,opacity;white-space:normal;overflow-wrap:anywhere;text-shadow:0 1px 3px #000,0 0 8px #000,0 0 15px #000;line-height:1.24;}
.entry .heading{display:block;margin-bottom:3px;font:600 10px/1.3 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#dcb96e}
.entry .body{display:block;font-size:15px;white-space:pre-line}
.entry .body strong{font-weight:800}
.entry .body u{text-decoration:underline;text-decoration-thickness:from-font;text-underline-offset:2px}
.entry.me .body{font-size:14px;font-style:italic;color:#e8e0cc}
.entry.do .body{font-size:15px;font-style:italic;color:#ecd7a8}
.entry.scene .body{font-size:14px}
.entry[data-color='red'] .body{color:#e0a6a2}.entry[data-color='grey'] .body{color:#c6c6c6}.entry[data-color='white'] .body{color:#fff}
.entry[data-font='plain']{font-family:Arial,Helvetica,sans-serif}.entry[data-font='bold']{font-family:Georgia,'Times New Roman',serif}.entry[data-font='bold'] .body{font-weight:900;letter-spacing:.035em}
.entry[data-font='elegant']{font-family:Georgia,'Palatino Linotype',serif;font-style:italic;letter-spacing:.018em}
/* Uses commonly available typefaces, not optional OS fonts. */
.entry[data-font='handwritten']{font-family:Georgia,'Times New Roman',serif;font-style:italic;letter-spacing:-.045em}.entry[data-font='handwritten'] .body{font-size:17px;font-weight:400}
.entry[data-font='typewriter']{font-family:'Courier New',Courier,monospace;letter-spacing:.025em}
.entry[data-font='blackletter']{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-variant:small-caps;letter-spacing:.055em}.entry[data-font='blackletter'] .body{text-shadow:0 0 2px currentColor,0 2px 4px #000,0 0 9px #000}
.entry[data-font='smallcaps']{font-family:Georgia,serif;font-variant:small-caps;letter-spacing:.12em}
.entry[data-color='green'] .body{color:#a6d7a5}.entry[data-color='blue'] .body{color:#a6c8ed}
.entry[data-color='violet'] .body{color:#d3afe5}.entry[data-color='gold'] .body{color:#ebc46d}
.entry[data-color='sepia'] .body{color:#c9aa81}
</style></head><body><div id="canvas"></div>
<script>
'use strict';
const host=document.getElementById('canvas');
const nodes=new Map();
let data={camera:null,labels:[]};
function safeText(v){return String(v??'').slice(0,280)}
// Safe inline scene markup: **bold** and __underline__. Text is never parsed as HTML.
function renderFormattedText(host,text){
 const value=safeText(text);
 const root=document.createDocumentFragment(), stack=[{node:root,token:''}];
 let plain='';
 function flush(){if(plain){stack[stack.length-1].node.appendChild(document.createTextNode(plain));plain='';}}
 for(let i=0;i<value.length;){
  const token=value.slice(i,i+2);
  if(token==='**'||token==='__'){
   const active=stack[stack.length-1];
   if(active.token===token){flush();stack.pop();i+=2;continue;}
   // Only open a marker if it has a matching closing marker ahead.
   if(value.indexOf(token,i+2)!==-1){flush();const el=document.createElement(token==='**'?'strong':'u');active.node.appendChild(el);stack.push({node:el,token});i+=2;continue;}
  }
  plain+=value[i++];
 }
 flush();host.replaceChildren(root);
}
function renderNodes(){
 const found=new Set();
 for(const label of data.labels||[]){
  const id=String(label.id||'');if(!id)continue;found.add(id);
  let el=nodes.get(id);
  if(!el){el=document.createElement('div');el.className='entry';const hd=document.createElement('span');hd.className='heading';const bd=document.createElement('span');bd.className='body';el.append(hd,bd);host.append(el);nodes.set(id,el);}
  el.className='entry '+(label.kind==='do'?'do':label.kind==='me'?'me':'scene');
  el.dataset.color=String(label.style?.color||'parchment').toLowerCase();
  el.dataset.font=String(label.style?.font||'serif').toLowerCase();
  el.children[0].textContent=safeText(label.category||'');
  el.children[0].style.display=label.category?'block':'none';
  renderFormattedText(el.children[1],label.text);
  el.style.display='none';
 }
 for(const [id,el] of nodes){if(!found.has(id)){el.remove();nodes.delete(id);}}
}
function project(point,camera,width,height){
 if(!point||!camera?.position)return null;
 const yaw=Number(camera.yaw||0)*Math.PI/180,pitch=Number(camera.pitch||0)*Math.PI/180;
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const dx=Number(point.x)-Number(camera.position.x),dy=Number(point.y)-Number(camera.position.y),dz=Number(point.z)-Number(camera.position.z);
 const depth=dx*cy*cp+dy*sy*cp+dz*sp;
 if(!Number.isFinite(depth)||depth<20)return null;
 const right=-dx*sy+dy*cy;
 const up=-dx*cy*sp-dy*sy*sp+dz*cp;
 const fov=Math.min(150,Math.max(20,Number(camera.fov)||85))*Math.PI/180;
 const tanH=Math.tan(fov/2),tanV=tanH*(height/width);
 const x=width*(.5+right/(2*depth*tanH));
 const y=height*(.5-up/(2*depth*tanV));
 if(x< -100||x>width+100||y< -100||y>height+100)return null;
 return {x,y,depth};
}
function frame(){
 const {camera,labels}=data, w=window.innerWidth,h=window.innerHeight;
 for(const label of labels||[]){
  const el=nodes.get(String(label.id||''));if(!el)continue;
  const p=project(label.position,camera,w,h);
  if(!p){el.style.display='none';continue;}
  const scale=Math.max(.7,Math.min(1.15,450/(p.depth+200)));
  el.style.display='block';
  el.style.transform=`translate(-50%,-50%) translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) scale(${scale.toFixed(3)})`;
  el.style.opacity=String(Math.max(.42,Math.min(1,1800/(p.depth+300))));
 }
 requestAnimationFrame(frame);
}
window.addEventListener('scenes:labels',ev=>{const v=ev.detail;if(!v||!Array.isArray(v.labels))return;data={camera:v.camera,labels:v.labels};renderNodes();});
requestAnimationFrame(frame);
try{callEvent('ready','{}')}catch(e){console.error('[fm_scenes] view ready failed',e)}
</script></body></html>
